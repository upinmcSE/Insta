version: '3.8'
name: "insta"

services:
  mysql:
    image: mysql:latest
    container_name: insta-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: insta
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: insta-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
    mysql_data: